---
layout: minif-default
title: Blog
---

<h1>Blog</h1>
<p>Find blog posts I have made.</p>

<ul>
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <a>{{ post.date | date: "%Y-%m-%d" }}</a>
      <a>{{ post.tags }}</a>
      <p>{{ post.excerpt }}</p>
    </li>
  {% endfor %}
</ul>
