<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Tac tic toe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>Tic Tac Toe</h1>
<div class="white">
  <button id="aa" type="button">-</button>
  <button id="ab" type="button">-</button>
  <button id="ac" type="button">-</button>
</div>
<div class="white">
  <button id="ba" type="button">-</button>
  <button id="bb" type="button">-</button>
  <button id="bc" type="button">-</button>
</div>
<div class="white">
  <button id="ca" type="button">-</button>
  <button id="cb" type="button">-</button>
  <button id="cc" type="button">-</button>
</div>
<p id="turn" class="turn">-'s Turn</p>
<div>
  <button id="reset" type="button" class="big">Reset</button>
</div>
<script src="js/index.js"></script>
</body>
</html>
